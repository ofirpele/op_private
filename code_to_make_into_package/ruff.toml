exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 100
indent-width = 4

[lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
# select = ["F", "ANN001", "E4", "E7", "E9", "W", "E", "C4", "ISC", "RET", "SIM", "TD", "NPY"]
select = ["ALL"]
ignore = [
    "TD", # TO DO
    "FIX002", # TO DO
    "D", # docstring    
    "S101", # assert
    "ANN204", # Missing return type annotation for special method
    "INP001", # implicit namespace package    
    "PLR0913", # too many params
    "LOG015", # root logger 
    "COM812", # missing-trailing-comma. warning of conflict with formatter
    "PGH004", # noqa should be specific 
    "B024", # ABC without abstractmethod
]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"{tests/*,**/_test__*.py,**/conftest.py}" = [
    "PLR2004", # magic number comparison
    "SLF001",  # Private member accessed
    "ANN201",  # missing-return-type-undocumented-public-function
    "ANN202",  # missing-return-type-undocumented-private-function
    "ARG002",  # Unused method argument
]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"