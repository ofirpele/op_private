[project]
name = "op"
version = "0.1.0"
description = "op"
readme = "docs/README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "imageio[ffmpeg]>=2.37.2",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "pandas>=2.3.3",
    "pydantic>=2.11.9",
    "pydantic-numpy>=8.0.1",
    "scikit-learn>=1.7.2",
    "sortedcontainers>=2.4.0",
    "sortedcontainers-pydantic>=2.0.0",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "pydantic-2-mermaid>=0.7.3",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
python_files = ["_test__*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
